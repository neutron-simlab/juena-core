name: juena-core-demo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: juena_demo
      POSTGRES_USER: juena_demo
      POSTGRES_PASSWORD: juena_demo
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juena_demo -d juena_demo"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - demo-postgres:/var/lib/postgresql/data

volumes:
  demo-postgres:
