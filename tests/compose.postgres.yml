services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: juena_core_test
      POSTGRES_PASSWORD: juena_core_test
      POSTGRES_DB: juena_core_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juena_core_test"]
      interval: 1s
      timeout: 3s
      retries: 30
